name: 'Run Linter'
description: 'Run Linter'

inputs:
  os:
    description: "operating system"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Python Packages
      if: inputs.os != 'Windows'
      shell: bash
      run: |
        uv pip install --system --group lint
        uv pip install --system -r pyproject.toml --all-extras

    - name: Install Python Packages (Windows)
      if: inputs.os == 'Windows'
      shell: bash
      run: |
        uv pip install --system --group lint
        uv pip install --system -r pyproject.toml --extra graphblas

    - name: Lint with ruff
      shell: bash
      run: |
        ruff check

    - name: Check formatting with ruff
      shell: bash
      run: |
        ruff format --check --diff || \
        { echo "::error::Formatting check failed. Run 'ruff format' to fix."; exit 1; }

    - name: Lint With MyPy
      shell: bash
      run: |
        mypy --install-types --non-interactive .

    - name: Lint with clang-format
      if: inputs.os == 'Linux'
      shell: bash
      run: |
        find . \
        -type d -name third_party -prune -o \
        -type d -name thirdparties -prune -o \
        -type d -name protocol -prune -o \
        -type d -name 'build*' -prune -o \
        -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | \
        xargs -0 clang-format-21 --Werror --dry-run --
