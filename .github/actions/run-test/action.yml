name: 'Run Tests With Wheel Installed'
description: 'Run Unit Tests And Examples With Wheel Installed'

inputs:
  os:
    description: "operating system"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install scapy for MITM tests
      shell: bash
      run: uv pip install --system scapy==2.*

    - name: Install websockets for the YMQ WebSocket interop tests
      shell: bash
      run: uv pip install --system "websockets>=12.0"

    - name: Install pytest, pytest-xdist to run the unit tests in parallel, and pytest-timeout to fail hung tests
      shell: bash
      run: uv pip install --system "pytest>=9.1.1" "pytest-timeout>=2.4.0" "pytest-xdist>=3.8.0"

    - name: Install ray for the ray compatibility tests
      shell: bash
      run: uv pip install --system "ray>=2.59.0"

    - name: Install pydivert and pywin32 for MITM tests (Windows)
      if: inputs.os == 'Windows'
      shell: bash
      run: uv pip install --system pydivert pywin32

    - name: Run C++ Tests (Linux/macOS)
      if: inputs.os == 'Linux' || inputs.os == 'macOS'
      shell: bash
      # The MITM tests need root (scapy TUN device), so run under sudo.
      # sudo scrubs LD_LIBRARY_PATH / DYLD_LIBRARY_PATH, so re-inject them via env.
      run: |
        sudo env \
          "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
          "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH:-}" \
          ./scripts/test.sh

    - name: Run C++ Tests (Windows)
      if: inputs.os == 'Windows'
      shell: pwsh
      run: ./scripts/test.ps1 -C Debug

    - name: Build Wheel
      shell: bash
      run: |
        uv pip install --system build
        python -m build --wheel

    - name: Install Wheel
      shell: bash
      run: |
        wheel_file=$(ls dist/*.whl | head -n 1)
        echo "Installing wheel: $wheel_file"
        uv pip install --system "$wheel_file[all]"

    - name: Run Unittests
      shell: bash
      run: |
        python -m pytest -n auto -v tests

    - name: Dump the stacks of the Python processes left after a failed test run (Linux/macOS)
      if: failure() && (inputs.os == 'Linux' || inputs.os == 'macOS')
      shell: bash
      # py-spy needs root to attach. sudo resets PATH, so pass py-spy's full path.
      run: |
        uv pip install --system "py-spy>=0.4.0"
        py_spy=$(command -v py-spy)
        for pid in $(pgrep -i python); do
          echo "::group::py-spy dump --pid $pid"
          ps -o pid=,ppid=,command= -p "$pid" || true
          sudo "$py_spy" dump --pid "$pid" || true
          echo "::endgroup::"
        done

    - name: Run Examples (Linux)
      if: inputs.os == 'Linux'
      shell: bash
      run: |
        readarray -t skip_examples < examples/skip_examples.txt
        for example in "./examples"/*.py; do
          filename=$(basename "$example")
          if [[ " ${skip_examples[*]} " =~ [[:space:]]${filename}[[:space:]] ]]; then
            echo "Skipping $example"
            continue
          fi
          echo "Running $example"
          python $example
        done

        uv pip install --system -r examples/ray_compat/requirements.txt
        readarray -t skip_tests < examples/ray_compat/skip_tests.txt
        for example in "./examples/ray_compat"/*.py; do
          filename=$(basename "$example")
          if [[ " ${skip_tests[*]} " =~ [[:space:]]${filename}[[:space:]] ]]; then
              echo "Skipping $example"
              continue
          fi

          echo "Running $example"
          python $example
        done

        uv pip install --system -r examples/applications/requirements_applications.txt
        for example in "./examples/applications"/*.py; do
          if python -c 'import sys; sys.exit(not sys.version_info <= (3, 10))'; then
            if [ "$example" = "./examples/applications/yfinance_historical_price.py" ]; then
              echo "Skipping $example"
              continue;
            fi
          fi

          echo "Running $example"
          python $example
        done

        if python -c 'import sys; sys.exit(not sys.version_info >= (3, 10))'; then
          uv pip install --system -r examples/libraries/requirements.txt
          for example in "./examples/libraries"/*.py; do
            echo "Running $example"
            python $example
          done
        else
          echo "Skipping examples/libraries on Python < 3.10"
        fi
